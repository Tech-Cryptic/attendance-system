services:
  - type: web
    name: faceattend
    runtime: python
    rootDir: backend
    buildCommand: >
      cd ../frontend &&
      npm ci &&
      npm run build &&
      cd ../backend &&
      pip install -r requirements.txt
    startCommand: bash start.sh

    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: faceattend-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FRONTEND_URL
        value: https://faceattend-bc91.onrender.com
      # Optional: set OPENAI_API_KEY in the Render dashboard to enable the LLM
      # review workflow. Without it the app uses deterministic fallback rules.
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: SHOW_SEED_SUMMARY
        value: "0"


databases:
  - name: faceattend-db
    plan: free
    region: oregon
    databaseName: attendance_db
